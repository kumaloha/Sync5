<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 快进 Fast Forward</title>
<style>
:root{--ac:#1effec;--glo:rgba(30,255,236,.28)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:var(--ac)}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
.floor{position:absolute;left:0;right:0;bottom:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.joker{position:absolute;left:312px;top:112px;width:96px;height:128px;border-radius:10px;border:2px solid var(--ac);background:linear-gradient(165deg,rgba(24,26,48,.92),rgba(7,7,15,.96));box-shadow:0 0 16px var(--glo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:2}
.joker b{font-size:26px;color:var(--ac);text-shadow:0 0 14px var(--ac);letter-spacing:2px}
.joker i{font-style:normal;font-size:13px;color:#aeb6d8;letter-spacing:3px}
/* 累计角标:永久成长的账本 */
.stack{position:absolute;right:-10px;top:-10px;padding:2px 7px;border-radius:8px;font-size:13px;font-weight:700;color:#031513;background:var(--ac);box-shadow:0 0 10px var(--glo)}
.play .stack{animation:tick 2.4s linear forwards}
@keyframes tick{0%,26%{transform:scale(1)}30%{transform:scale(1.35)}38%,100%{transform:scale(1)}}
/* 双三角倍速扫屏 */
.chev{position:absolute;top:160px;width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:26px solid var(--ac);filter:drop-shadow(0 0 8px var(--ac));opacity:0;z-index:3}
.c1{left:60px}.c2{left:96px}
.play .c1{animation:sweep .42s cubic-bezier(.25,.9,.3,1) .04s forwards}
.play .c2{animation:sweep .42s cubic-bezier(.25,.9,.3,1) .1s forwards}
@keyframes sweep{0%{opacity:0;transform:translateX(-80px)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(560px)}}
/* 速度线 */
.sl{position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--ac));opacity:0;border-radius:2px}
.s1{top:142px;left:40px;width:180px}.s2{top:176px;left:20px;width:230px}.s3{top:196px;left:70px;width:150px}.s4{top:158px;left:110px;width:120px}
.play .sl{animation:line .5s ease-out forwards}
.play .s2{animation-delay:.05s}.play .s3{animation-delay:.08s}.play .s4{animation-delay:.12s}
@keyframes line{0%{opacity:0;transform:translateX(-60px) scaleX(.3)}25%{opacity:.9}100%{opacity:0;transform:translateX(420px) scaleX(1)}}
/* 数值弹出 */
.pop{position:absolute;left:322px;top:74px;font-weight:700;font-size:26px;color:var(--ac);text-shadow:0 0 12px var(--ac);opacity:0;z-index:4}
.play .pop{animation:pop .58s cubic-bezier(.2,1.4,.4,1) .3s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.15)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(.96)}}
</style>
<body>
<h1>快进 Fast Forward<small>触发:每次提前收工 → 倍率永久 +0.1</small></h1>
<div class="verb">视觉动词:倍速扫屏 —— 双三角掠过,速度线未散,账已记上</div>
<div class="stage" id="s">
  <div class="floor"></div>
  <div class="sl s1"></div><div class="sl s2"></div><div class="sl s3"></div><div class="sl s4"></div>
  <div class="chev c1"></div><div class="chev c2"></div>
  <div class="joker"><b>&#9654;&#9654;</b><i>快进</i><span class="stack">&times;1.3</span></div>
  <div class="pop">+0.1&times;</div>
</div>
<script>
const st=document.getElementById('s');
function go(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
go();setInterval(go,2400);
</script>
</body>
</html>
