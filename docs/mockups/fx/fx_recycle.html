<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 回收 Recycle</title>
<style>
:root{--ac:#1effec;--glo:rgba(30,255,236,.28)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:var(--ac)}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
.joker{position:absolute;left:120px;top:110px;width:96px;height:128px;border-radius:10px;border:2px solid var(--ac);background:linear-gradient(165deg,rgba(24,26,48,.92),rgba(7,7,15,.96));box-shadow:0 0 16px var(--glo);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;z-index:2}
.joker i{font-style:normal;font-size:13px;color:#aeb6d8;letter-spacing:3px}
/* 三段弧箭旋涡 */
.vortex{position:absolute;left:430px;top:176px;width:150px;height:150px;margin:-75px;z-index:2}
.play .vortex{animation:spin .62s cubic-bezier(.3,.2,.4,1) forwards}
@keyframes spin{0%{transform:rotate(0);opacity:.5}25%{opacity:1}85%{opacity:1}100%{transform:rotate(300deg);opacity:.35}}
.vortex svg{overflow:visible}
.arc{fill:none;stroke:var(--ac);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--ac))}
.head{fill:var(--ac);filter:drop-shadow(0 0 6px var(--ac))}
/* 被卷入的缓存牌:吸入中心缩没 */
.cardw{position:absolute;left:580px;top:250px;z-index:3}
.play .cardw{animation:suck .5s cubic-bezier(.5,0,.7,.4) .06s forwards}
@keyframes suck{0%{transform:translate(0,0)}100%{transform:translate(-176px,-108px)}}
.cc{width:52px;height:72px;border-radius:8px;border:1.5px solid #b26bff;background:linear-gradient(165deg,rgba(30,22,48,.92),rgba(10,7,18,.96));display:flex;align-items:center;justify-content:center;font-size:20px;color:#ff6aa9}
.play .cc{animation:shrink .5s cubic-bezier(.5,0,.7,.4) .06s forwards}
@keyframes shrink{0%{transform:rotate(0) scale(1);opacity:1}70%{opacity:1}100%{transform:rotate(-260deg) scale(.06);opacity:0}}
/* 吐出双倍:数值从旋涡心弹出 */
.pop{position:absolute;left:396px;top:70px;font-weight:700;font-size:26px;color:var(--ac);text-shadow:0 0 12px var(--ac);opacity:0;z-index:4}
.pop small{font-size:14px;color:#9feee7;margin-left:6px}
.play .pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1) .5s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.15)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
/* 两粒闪点跟着数值走 */
.gl{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);opacity:0;z-index:4}
.g1{left:390px;top:96px}.g2{left:474px;top:88px}
.play .gl{animation:up .45s ease-out .54s forwards}
.play .g2{animation-delay:.6s}
@keyframes up{0%{opacity:1;transform:translateY(8px)}100%{opacity:0;transform:translateY(-22px)}}
</style>
<body>
<h1>回收 Recycle<small>触发:直弃缓存牌 → 按点数两倍给奖励分</small></h1>
<div class="verb">视觉动词:循环卷牌 —— 三箭旋涡把弃牌卷走,吐出双倍点数</div>
<div class="stage" id="s">
  <div class="vortex">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <path class="arc" d="M75,13 A62,62 0 0 1 129,44"/><polygon class="head" points="129,44 114,40 124,56"/>
      <path class="arc" d="M137,90 A62,62 0 0 1 92,134"/><polygon class="head" points="92,134 100,121 82,123"/>
      <path class="arc" d="M28,120 A62,62 0 0 1 15,60"/><polygon class="head" points="15,60 11,75 27,68"/>
    </svg>
  </div>
  <div class="cardw"><div class="cc">9</div></div>
  <div class="joker"><i>回收</i></div>
  <div class="pop">+18<small>9 &times; 2</small></div>
  <div class="gl g1"></div><div class="gl g2"></div>
</div>
<script>
const st=document.getElementById('s');
function go(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
go();setInterval(go,2400);
</script>
</body>
</html>
