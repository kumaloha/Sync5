<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 孤注 All In</title>
<style>
:root{--au:#ff9b2b;--rd:#ff3632}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:var(--au)}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
.floor{position:absolute;left:0;right:0;bottom:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.joker{position:absolute;left:312px;top:140px;width:96px;height:128px;border-radius:10px;border:2px solid var(--au);background:linear-gradient(165deg,rgba(30,24,40,.92),rgba(10,7,12,.96));box-shadow:0 0 16px rgba(255,155,43,.3);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;z-index:2}
.joker i{font-style:normal;font-size:13px;color:#aeb6d8;letter-spacing:3px}
/* 硬币:抛起旋转 → 悬停一顿 → 落定 */
.coinw{position:absolute;left:340px;top:150px;z-index:3}
.play .coinw{animation:toss .62s cubic-bezier(.35,0,.6,1) forwards}
@keyframes toss{0%{transform:translateY(0)}42%{transform:translateY(-104px)}58%{transform:translateY(-100px)}100%{transform:translateY(0)}}
.coin{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--au);background:radial-gradient(circle at 34% 30%,#ffd9a8,var(--au) 66%,#a85d10);box-shadow:0 0 14px rgba(255,155,43,.5);display:flex;align-items:center;justify-content:center;font-weight:700;color:#3a2103;font-size:18px}
.play .coin{animation:spin .62s linear forwards}
@keyframes spin{0%{transform:scaleX(1)}10%{transform:scaleX(.12)}20%{transform:scaleX(1)}30%{transform:scaleX(.12)}40%{transform:scaleX(1)}50%{transform:scaleX(.4)}58%{transform:scaleX(.4)}72%{transform:scaleX(1)}84%{transform:scaleX(.3)}100%{transform:scaleX(1)}}
/* 赢:金环爆发 */
.ringw{position:absolute;left:360px;top:190px;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid var(--au);opacity:0;box-shadow:0 0 18px rgba(255,155,43,.5);z-index:2}
.play.win .ringw{animation:ring .4s ease-out .6s forwards}
@keyframes ring{0%{opacity:0;transform:scale(.5)}25%{opacity:1}100%{opacity:0;transform:scale(3.4)}}
/* 输:红幕下沉 */
.sag{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(255,54,50,.28));opacity:0;z-index:1}
.play.lose .sag{animation:sink .55s ease-out .6s forwards}
@keyframes sink{0%{opacity:0;transform:translateY(-40px)}35%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}
/* 结果弹出 */
.pop{position:absolute;left:330px;top:92px;font-weight:700;font-size:30px;opacity:0;z-index:4}
.popwin{color:var(--au);text-shadow:0 0 14px var(--au)}
.poplose{color:var(--rd);text-shadow:0 0 14px var(--rd)}
.play.win .popwin{animation:pop .55s cubic-bezier(.2,1.4,.4,1) .64s forwards}
.play.lose .poplose{animation:drop .55s ease-in .64s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.2)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@keyframes drop{0%{opacity:0;transform:translateY(-8px) scale(1.1)}30%{opacity:1;transform:translateY(4px) scale(1)}75%{opacity:1;transform:translateY(10px) rotate(-4deg)}100%{opacity:0;transform:translateY(20px) rotate(-6deg)}}
.tag{position:absolute;right:12px;top:10px;font-size:12px;color:#8b93b8;letter-spacing:1px}
</style>
<body>
<h1>孤注 All In<small>触发:每拍抛硬币 → &times;2 或 &times;0.5</small></h1>
<div class="verb">视觉动词:抛硬币定格 —— 空中旋转,悬停一顿,落地定生死(demo 隔次切换输赢)</div>
<div class="stage" id="s">
  <div class="floor"></div>
  <div class="sag"></div>
  <div class="ringw"></div>
  <div class="joker"><i>孤注</i></div>
  <div class="coinw"><div class="coin">&#9670;</div></div>
  <div class="pop popwin">&times;2</div>
  <div class="pop poplose">&times;0.5</div>
  <div class="tag" id="tag">WIN</div>
</div>
<script>
const st=document.getElementById('s'),tag=document.getElementById('tag');let n=0;
function go(){
  st.classList.remove('play','win','lose');void st.offsetWidth;
  const w=n%2===0;st.classList.add('play',w?'win':'lose');
  tag.textContent=w?'WIN':'LOSE';n++;
}
go();setInterval(go,2500);
</script>
</body>
</html>
