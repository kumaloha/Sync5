<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 打碟 Deejay</title>
<style>
:root{--ac:#7642ff;--glo:rgba(118,66,255,.32)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:#a98aff}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
.floor{position:absolute;left:0;right:0;bottom:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.joker{position:absolute;left:312px;top:140px;width:96px;height:128px;border-radius:10px;border:2px solid var(--ac);background:linear-gradient(165deg,rgba(24,26,48,.92),rgba(7,7,15,.96));box-shadow:0 0 16px var(--glo);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px}
.joker i{font-style:normal;font-size:13px;color:#aeb6d8;letter-spacing:3px}
/* 唱盘:同心刻纹 + 指示标线 */
.disc{position:absolute;left:308px;top:96px;width:104px;height:104px;border-radius:50%;z-index:3;
background:repeating-radial-gradient(circle at 50% 50%,#0b0b16 0 3px,#151527 3px 6px);
border:2px solid var(--ac);box-shadow:0 0 18px var(--glo),inset 0 0 14px rgba(118,66,255,.25)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac)}
.disc::before{content:"";position:absolute;left:50%;top:4px;width:3px;height:44px;margin-left:-1.5px;background:linear-gradient(#c9b3ff,transparent);border-radius:2px}
.play .disc{animation:scratch .6s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes scratch{0%{transform:rotate(0)}38%{transform:rotate(210deg)}40%{transform:rotate(208deg)}56%{transform:rotate(128deg)}62%{transform:rotate(132deg)}80%{transform:rotate(196deg)}100%{transform:rotate(200deg)}}
/* 刮擦刻线火花:反搓瞬间从盘缘弹出 */
.tick{position:absolute;width:3px;height:16px;background:var(--ac);border-radius:2px;opacity:0;box-shadow:0 0 8px var(--ac);z-index:4}
.t1{left:288px;top:118px;transform:rotate(-40deg)}
.t2{left:424px;top:110px;transform:rotate(35deg)}
.t3{left:298px;top:180px;transform:rotate(-70deg)}
.t4{left:418px;top:176px;transform:rotate(65deg)}
.play .tick{animation:spark .22s ease-out .34s forwards}
.play .t2{animation-delay:.4s}.play .t3{animation-delay:.44s}.play .t4{animation-delay:.38s}
@keyframes spark{0%{opacity:0;transform:scale(.4) translateY(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-14px)}}
/* 数值弹出 */
.pop{position:absolute;left:314px;top:56px;font-weight:700;font-size:26px;color:#c9b3ff;text-shadow:0 0 12px var(--ac);opacity:0;z-index:5}
.play .pop{animation:pop .58s cubic-bezier(.2,1.4,.4,1) .4s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.15)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(.96)}}
</style>
<body>
<h1>打碟 Deejay<small>触发:每刷新一次商店 → 倍率永久 +0.05</small></h1>
<div class="verb">视觉动词:搓碟回拉 —— 唱盘正转急停、反搓一下再放行,刻线火花四溅</div>
<div class="stage" id="s">
  <div class="floor"></div>
  <div class="joker"><i>打碟</i></div>
  <div class="disc"></div>
  <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
  <div class="pop">+0.05&times;</div>
</div>
<script>
const st=document.getElementById('s');
function go(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
go();setInterval(go,2400);
</script>
</body>
</html>
