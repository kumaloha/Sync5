<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 合奏 Ensemble</title>
<style>
:root{--ac:#7642ff;--glo:rgba(118,66,255,.32)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:#a98aff}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
.floor{position:absolute;left:0;right:0;bottom:66px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
/* 聚光锥:从只罩 5 张,展宽到罩 8 张 */
.cone{position:absolute;left:360px;top:-10px;width:340px;height:330px;margin-left:-170px;transform-origin:50% 0;transform:scaleX(.62);opacity:.55;z-index:1;
background:linear-gradient(180deg,rgba(118,66,255,.34),rgba(118,66,255,.05) 78%,transparent);
clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.play .cone{animation:widen .5s cubic-bezier(.2,.9,.3,1) .12s forwards}
@keyframes widen{0%{transform:scaleX(.62)}70%{transform:scaleX(1.05)}100%{transform:scaleX(1)}}
/* 手牌五张 */
.hand{position:absolute;bottom:70px;width:54px;height:74px;border-radius:8px;border:1.5px solid #9fe9ff;background:linear-gradient(165deg,rgba(22,26,44,.92),rgba(8,9,16,.96));display:flex;align-items:center;justify-content:center;font-size:20px;color:#9fe9ff;z-index:2}
.h1{left:206px}.h2{left:266px}.h3{left:326px}.h4{left:386px}.h5{left:446px}
/* 缓存三张:弧线跃上台,接到手牌行尾 */
.cachewrap{position:absolute;z-index:3}
.cache{width:54px;height:74px;border-radius:8px;border:1.5px solid #b26bff;background:linear-gradient(165deg,rgba(30,22,48,.92),rgba(10,7,18,.96));display:flex;align-items:center;justify-content:center;font-size:20px;color:#ff6aa9;box-shadow:0 0 10px rgba(118,66,255,.25)}
.w1{left:560px;bottom:6px}.w2{left:620px;bottom:6px}.w3{left:680px;bottom:6px}
.play .w1{animation:hopx .46s cubic-bezier(.3,.6,.4,1) .06s forwards}
.play .w2{animation:hopx2 .46s cubic-bezier(.3,.6,.4,1) .14s forwards}
.play .w3{animation:hopx3 .46s cubic-bezier(.3,.6,.4,1) .22s forwards}
@keyframes hopx{100%{transform:translateX(-54px) translateY(-64px)}}
@keyframes hopx2{100%{transform:translateX(-54px) translateY(-64px)}}
@keyframes hopx3{100%{transform:translateX(-54px) translateY(-64px)}}
/* 里层负责抛物线的"上抛"分量 */
.play .w1 .cache{animation:arc .46s cubic-bezier(.2,1.6,.6,1) .06s}
.play .w2 .cache{animation:arc .46s cubic-bezier(.2,1.6,.6,1) .14s}
.play .w3 .cache{animation:arc .46s cubic-bezier(.2,1.6,.6,1) .22s}
@keyframes arc{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-52px) rotate(-8deg)}100%{transform:translateY(0) rotate(0)}}
/* 落地光点 */
.land{position:absolute;bottom:66px;width:54px;height:6px;border-radius:50%;background:var(--ac);filter:blur(4px);opacity:0;z-index:2}
.l1{left:506px}.l2{left:566px}.l3{left:626px}
.play .land{animation:tap .24s ease-out .48s forwards}
@keyframes tap{0%{opacity:0;transform:scaleX(.4)}40%{opacity:.9;transform:scaleX(1.2)}100%{opacity:0;transform:scaleX(1)}}
/* 文字弹出 */
.pop{position:absolute;left:280px;top:56px;font-weight:700;font-size:24px;color:#c9b3ff;text-shadow:0 0 12px var(--ac);letter-spacing:2px;opacity:0;z-index:5}
.play .pop{animation:pop .58s cubic-bezier(.2,1.4,.4,1) .5s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.15)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(.96)}}
</style>
<body>
<h1>合奏 Ensemble<small>触发:缓存也上台 → 8 张里挑最好的 5 张</small></h1>
<div class="verb">视觉动词:缓存登台 —— 三张跃上舞台接到队尾,聚光锥从五张展宽到八张</div>
<div class="stage" id="s">
  <div class="cone"></div>
  <div class="floor"></div>
  <div class="hand h1">A</div><div class="hand h2">K</div><div class="hand h3">9</div><div class="hand h4">7</div><div class="hand h5">4</div>
  <div class="cachewrap w1"><div class="cache">J</div></div>
  <div class="cachewrap w2"><div class="cache">8</div></div>
  <div class="cachewrap w3"><div class="cache">5</div></div>
  <div class="land l1"></div><div class="land l2"></div><div class="land l3"></div>
  <div class="pop">BEST 5 / 8</div>
</div>
<script>
const st=document.getElementById('s');
function go(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
go();setInterval(go,2600);
</script>
</body>
</html>
