<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 斗牛士 Matador</title>
<style>
:root{--ac:#ff3632;--au:#ff9b2b;--glo:rgba(255,54,50,.32)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:var(--ac)}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
.floor{position:absolute;left:0;right:0;bottom:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.joker{position:absolute;left:312px;top:112px;width:96px;height:128px;border-radius:10px;border:2px solid var(--ac);background:linear-gradient(165deg,rgba(40,20,26,.92),rgba(12,6,8,.96));box-shadow:0 0 16px var(--glo);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;z-index:2}
.joker i{font-style:normal;font-size:13px;color:#aeb6d8;letter-spacing:3px}
/* 冲角流光:脸的规则冲过来,擦身而过扑空 */
.charge{position:absolute;left:-140px;top:206px;width:150px;height:6px;border-radius:4px;z-index:1;
background:linear-gradient(90deg,transparent,#fff 70%,var(--ac));filter:blur(.5px) drop-shadow(0 0 8px var(--ac));opacity:0}
.play .charge{animation:rush .34s cubic-bezier(.5,0,.8,1) forwards}
@keyframes rush{0%{opacity:0;transform:translateX(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(1000px)}}
/* 双角剪影跟在流光头部 */
.horn{position:absolute;left:-30px;top:196px;width:26px;height:26px;opacity:0;z-index:1;
border-left:4px solid var(--ac);border-top:4px solid var(--ac);border-radius:6px 0 0 0;transform:rotate(38deg);filter:drop-shadow(0 0 6px var(--ac))}
.play .horn{animation:rush .34s cubic-bezier(.5,0,.8,1) forwards}
/* 红布:从卡右上角甩出的弧形一挥 */
.cape{position:absolute;left:344px;top:96px;width:150px;height:160px;transform-origin:8% 6%;opacity:0;z-index:3;
background:radial-gradient(140% 120% at 0% 0%,var(--ac) 26%,rgba(255,54,50,.55) 55%,transparent 72%);
clip-path:polygon(0 0,72% 12%,100% 58%,84% 100%,30% 78%,6% 36%);filter:drop-shadow(0 0 14px var(--glo))}
.play .cape{animation:sweep .44s cubic-bezier(.3,.7,.3,1) .1s forwards}
@keyframes sweep{0%{opacity:0;transform:rotate(-70deg) skewY(-8deg) scale(.7)}22%{opacity:1}60%{opacity:1;transform:rotate(34deg) skewY(6deg) scale(1.04)}100%{opacity:0;transform:rotate(52deg) skewY(8deg) scale(.98)}}
/* 布后残影弧 */
.trail{position:absolute;left:334px;top:86px;width:180px;height:180px;border-radius:50%;border:3px solid transparent;border-top-color:var(--ac);border-right-color:var(--ac);opacity:0;filter:blur(1px);z-index:2}
.play .trail{animation:arcfade .5s ease-out .22s forwards}
@keyframes arcfade{0%{opacity:.9;transform:rotate(-40deg)}100%{opacity:0;transform:rotate(40deg)}}
/* 金币落袋 */
.coin{position:absolute;font-size:20px;color:var(--au);text-shadow:0 0 10px var(--au);opacity:0;z-index:4}
.c1{left:428px;top:120px}.c2{left:452px;top:140px}
.play .coin{animation:drop .4s cubic-bezier(.3,1.4,.5,1) .46s forwards}
.play .c2{animation-delay:.54s}
@keyframes drop{0%{opacity:0;transform:translateY(-18px) scale(.5)}40%{opacity:1;transform:translateY(0) scale(1.15)}70%{transform:scale(1)}100%{opacity:0;transform:translateY(6px)}}
.pop{position:absolute;left:420px;top:84px;font-weight:700;font-size:24px;color:var(--au);text-shadow:0 0 12px var(--au);opacity:0;z-index:4}
.play .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) .5s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.15)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
</style>
<body>
<h1>斗牛士 Matador<small>触发:脸的规则咬到你的拍 → +2&#9670;</small></h1>
<div class="verb">视觉动词:红布一挥 —— 冲角擦身扑空,布弧未落,金币先落袋</div>
<div class="stage" id="s">
  <div class="floor"></div>
  <div class="charge"></div>
  <div class="horn"></div>
  <div class="joker"><i>斗牛士</i></div>
  <div class="trail"></div>
  <div class="cape"></div>
  <span class="coin c1">&#9670;</span><span class="coin c2">&#9670;</span>
  <div class="pop">+2&#9670;</div>
</div>
<script>
const st=document.getElementById('s');
function go(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
go();setInterval(go,2400);
</script>
</body>
</html>
