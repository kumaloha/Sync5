<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>FX · 穷开心 Broke &amp; Happy</title>
<style>
:root{--ac:#ff9b2b;--rd:#ff3632;--glo:rgba(255,155,43,.32)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px;font-family:Rajdhani,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#dfe6ff}
h1{font-size:19px;font-weight:600;letter-spacing:.5px}
h1 small{color:#8b93b8;font-weight:400;font-size:14px;margin-left:10px}
.verb{font-size:13px;color:var(--ac)}
.stage{position:relative;width:720px;height:360px;background:#000;border:1px solid #171733;border-radius:12px;overflow:hidden;flex:none}
/* 卡:常驻 ×1.3 徽记(持续状态 = 标记,不逐拍演) */
.joker{position:absolute;left:96px;top:110px;width:96px;height:128px;border-radius:10px;border:2px solid var(--ac);background:linear-gradient(165deg,rgba(30,24,40,.92),rgba(10,7,12,.96));box-shadow:0 0 16px var(--glo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:2}
.joker b{font-size:26px;color:var(--ac);text-shadow:0 0 12px var(--ac)}
.joker i{font-style:normal;font-size:13px;color:#aeb6d8;letter-spacing:3px}
.badge{position:absolute;right:-12px;top:-10px;padding:2px 8px;border-radius:8px;font-size:13px;font-weight:700;color:#3a2103;background:var(--ac);box-shadow:0 0 10px var(--glo)}
/* 钱包:五格上限表(常驻标记) */
.wallet{position:absolute;left:352px;top:96px;display:flex;gap:10px;z-index:2}
.cell{width:44px;height:44px;border-radius:50%;border:2px solid #3a3a58;display:flex;align-items:center;justify-content:center;font-size:19px;color:#3a3a58}
.cell.full{border-color:var(--ac);color:var(--ac);text-shadow:0 0 10px var(--ac);box-shadow:0 0 10px var(--glo)}
.cap{position:absolute;left:346px;top:76px;width:276px;height:2px;background:var(--ac);box-shadow:0 0 8px var(--ac);z-index:2}
.cap::after{content:"上限 5◆";position:absolute;right:-4px;top:-22px;font-size:12px;color:var(--ac);letter-spacing:1px}
.play .cap{animation:capflash 1.4s ease-out .48s}
@keyframes capflash{0%{box-shadow:0 0 8px var(--ac)}18%{box-shadow:0 0 22px var(--ac),0 0 40px var(--glo)}40%{box-shadow:0 0 8px var(--ac)}100%{box-shadow:0 0 8px var(--ac)}}
/* 结算进账三枚:第一枚落入第 5 格,后两枚撞上限弹开 */
.cin{position:absolute;left:360px;top:320px;font-size:20px;color:var(--ac);text-shadow:0 0 10px var(--ac);opacity:0;z-index:3}
.play .c1{animation:landin .44s cubic-bezier(.3,.6,.4,1) .06s forwards}
@keyframes landin{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:1;transform:translate(216px,-202px) scale(1.1)}100%{opacity:0;transform:translate(216px,-202px) scale(.6)}}
.play .c2{animation:bounceL 0.8s cubic-bezier(.35,.4,.6,1) .3s forwards}
@keyframes bounceL{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}46%{transform:translate(112px,-242px) rotate(0)}60%{transform:translate(52px,-200px) rotate(-140deg)}100%{opacity:0;transform:translate(-70px,-40px) rotate(-420deg)}}
.play .c3{animation:bounceR 0.8s cubic-bezier(.35,.4,.6,1) .44s forwards}
@keyframes bounceR{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}46%{transform:translate(190px,-238px) rotate(0)}60%{transform:translate(250px,-192px) rotate(150deg)}100%{opacity:0;transform:translate(360px,-20px) rotate(430deg)}}
/* 第 5 格被点亮 */
.play .lastcell{animation:fill .3s ease-out .46s forwards}
@keyframes fill{0%{border-color:#3a3a58;color:#3a3a58}100%{border-color:var(--ac);color:var(--ac);text-shadow:0 0 10px var(--ac);box-shadow:0 0 10px var(--glo)}}
/* 撞线小星 */
.hit{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--ac);opacity:0;z-index:4}
.h1{left:470px;top:74px}.h2{left:548px;top:74px}
.play .h1{animation:spark .28s ease-out .64s forwards}
.play .h2{animation:spark .28s ease-out .78s forwards}
@keyframes spark{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.7)}100%{opacity:0;transform:scale(.5)}}
/* 「满了!」+ 穷开心的乐呵:卡缘笑一下 */
.pop{position:absolute;left:462px;top:34px;font-weight:700;font-size:22px;color:var(--ac);text-shadow:0 0 12px var(--ac);letter-spacing:2px;opacity:0;z-index:4}
.play .pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) .7s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.15)}55%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.play .joker{animation:chuckle .5s ease-in-out .8s}
@keyframes chuckle{0%{transform:rotate(0)}25%{transform:rotate(-3deg)}55%{transform:rotate(3deg)}100%{transform:rotate(0)}}
.note{position:absolute;left:352px;top:250px;font-size:13px;color:#5a6182;line-height:1.7;z-index:2}
</style>
<body>
<h1>穷开心 Broke &amp; Happy<small>hold:金币上限 5;常驻 &times;1.3(触发时机 = 进账被上限截断的瞬间)</small></h1>
<div class="verb">视觉动词:钱包弹币 —— 第五格落满,多出来的金币撞上限线蹦着滚出画面;卡乐得晃两下</div>
<div class="stage" id="s">
  <div class="joker"><b>&#9786;</b><i>穷开心</i><span class="badge">&times;1.3</span></div>
  <div class="cap"></div>
  <div class="wallet">
    <div class="cell full">&#9670;</div><div class="cell full">&#9670;</div><div class="cell full">&#9670;</div>
    <div class="cell full">&#9670;</div><div class="cell lastcell">&#9670;</div>
  </div>
  <span class="cin c1">&#9670;</span><span class="cin c2">&#9670;</span><span class="cin c3">&#9670;</span>
  <div class="hit h1"></div><div class="hit h2"></div>
  <div class="pop">满了!</div>
  <div class="note">常驻标记:上限线 + &times;1.3 徽记(不逐拍演)<br>一次性动效:只在截断瞬间弹币,&le;0.8s</div>
</div>
<script>
const st=document.getElementById('s');
function go(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
go();setInterval(go,2800);
</script>
</body>
</html>
