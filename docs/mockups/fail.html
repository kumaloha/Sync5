<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#04050d; }
  a { color:#35e8e0; text-decoration:none; } a:hover { color:#ff4fa3; }
  @keyframes dcstarin { 0% { transform:scale(3.2) rotate(-18deg); opacity:0; } 55% { transform:scale(.92) rotate(2deg); opacity:1; } 75% { transform:scale(1.12); } 100% { transform:scale(1) rotate(0deg); opacity:1; } }
  @keyframes dcstardrop { 0% { transform:translateY(0) rotate(0deg); opacity:0; } 20% { opacity:1; transform:translateY(6px) rotate(6deg); } 60% { transform:translateY(46px) rotate(24deg); } 75% { transform:translateY(40px) rotate(20deg); } 100% { transform:translateY(44px) rotate(22deg); opacity:1; } }
  @keyframes dcmergein { 0% { transform:scale(.3); opacity:0; } 40% { transform:scale(1.15); opacity:1; } 70% { transform:scale(.97); } 100% { transform:scale(1); opacity:1; } }
  @keyframes dcrain { from { background-position:0 0; } to { background-position:-80px 900px; } }
  @keyframes dcpulse { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  @keyframes dchead { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1.5px); } }
</style>
</helmet>
<div style="position:relative;width:720px;height:1280px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#060814 0%,#080a1a 45%,#04050e 78%,#020308 100%);font-family:'Rajdhani','Noto Sans SC',sans-serif;color:#cfe6ef;user-select:none;">
  <div style="position:absolute;inset:0;background:radial-gradient(520px 300px at 8% 0%,rgba(255,79,125,.12),transparent 68%),radial-gradient(560px 320px at 94% 6%,rgba(165,107,255,.08),transparent 68%),radial-gradient(400px 260px at 50% 8%,rgba(120,140,200,.06),transparent 70%);"></div>
  <div style="position:absolute;left:60px;top:40px;width:600px;height:900px;pointer-events:none;">
    <div style="position:absolute;left:20px;top:-14px;width:300px;height:880px;transform:rotate(-6deg);transform-origin:50% 0;">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,150,200,.10),rgba(120,150,200,.03) 50%,transparent 88%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(7px);"></div>
      <div style="position:absolute;left:50%;top:-3px;width:12px;height:12px;transform:translateX(-50%);border-radius:50%;background:#5a6a8a;box-shadow:0 0 10px 3px rgba(120,150,200,.4);"></div>
    </div>
    <div style="position:absolute;right:20px;top:-14px;width:300px;height:880px;transform:rotate(7deg);transform-origin:50% 0;">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,79,125,.10),rgba(255,79,125,.03) 50%,transparent 88%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(7px);"></div>
      <div style="position:absolute;left:50%;top:-3px;width:12px;height:12px;transform:translateX(-50%);border-radius:50%;background:#8a5a6a;box-shadow:0 0 10px 3px rgba(255,79,125,.35);"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.4;background-image:repeating-linear-gradient(168deg,transparent 0px,transparent 34px,rgba(180,220,255,.16) 35px,transparent 37px);background-size:80px 300px;animation:dcrain 1.1s linear infinite;"></div>

  <div style="position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;gap:26px;z-index:4;">
    <div style="font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:2.5px rgba(255,125,158,.75);filter:drop-shadow(0 0 8px rgba(255,79,125,.4));animation:dcstarin .55s cubic-bezier(.25,1.2,.4,1) .1s both;">★</div>
    <div style="font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:2.5px rgba(255,125,158,.75);filter:drop-shadow(0 0 8px rgba(255,79,125,.4));transform:translateY(-20px);animation:dcstarin .55s cubic-bezier(.25,1.2,.4,1) .32s both;">★</div>
    <div style="font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:2.5px rgba(120,140,180,.5);animation:dcstardrop 1.3s ease .6s both;">★</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:346px;text-align:center;z-index:4;">
    <div style="font-size:72px;font-weight:700;letter-spacing:18px;color:#ffe3ec;line-height:1;text-shadow:0 0 16px rgba(255,79,125,.9), 0 0 46px rgba(255,79,125,.5);">演出失败</div>
    <div style="margin-top:14px;font-size:17px;letter-spacing:12px;color:#c96a85;">STAGE FAILED · 观众散场了</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:490px;display:flex;justify-content:center;z-index:4;">
    <div style="position:relative;width:460px;padding:26px 36px 24px;border-radius:22px;border:1px solid rgba(255,79,125,.35);background:linear-gradient(165deg,rgba(30,10,20,.7),rgba(14,5,10,.82));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(255,79,125,.12), inset 0 1px 0 rgba(255,255,255,.1);animation:dcmergein .5s ease .4s both;">
      <div style="display:flex;align-items:baseline;justify-content:center;gap:12px;">
        <span style="font-size:16px;letter-spacing:3px;color:#8a6070;">最终得分</span>
        <span style="font-size:88px;font-weight:700;color:#ff9ecb;text-shadow:0 0 18px rgba(255,79,163,.6);line-height:1;">{{ shownScore }}</span>
        <span style="font-size:20px;color:#8a6070;">/ {{ target }}</span>
      </div>
      <div style="margin-top:8px;height:10px;border-radius:6px;background:rgba(30,16,26,.9);border:1px solid rgba(255,125,158,.18);overflow:hidden;">
        <div style="height:100%;border-radius:6px;background:linear-gradient(90deg,#ff4f7d,#ff9ecb);box-shadow:0 0 10px rgba(255,79,125,.6);width:{{ scorePct }};transition:width .1s linear;"></div>
      </div>
      <div style="margin-top:16px;text-align:center;font-size:19px;color:#c96a85;">还差 <span style="font-size:26px;font-weight:700;color:#ffd9a0;text-shadow:0 0 10px rgba(255,179,71,.6);">{{ lack }}</span> 分就能点燃全场</div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:840px;display:flex;justify-content:center;gap:16px;z-index:4;">
    <a href="Home 主页.dc.html" style="display:block;width:215px;">
      <div style-hover="transform:scale(1.04);" style="padding:15px 0;border-radius:16px;cursor:pointer;transition:transform .15s;text-align:center;border:1px solid rgba(120,150,200,.4);background:rgba(12,16,36,.6);color:#aebfe0;font-size:20px;letter-spacing:5px;">返回主页</div>
    </a>
    <a href="Neon Rain Card Game.dc.html" style="display:block;width:215px;">
      <div style-hover="transform:scale(1.04);" style-active="transform:scale(.97);" style="padding:15px 0;border-radius:16px;cursor:pointer;transition:transform .15s;text-align:center;border:2px solid rgba(255,79,125,.9);background:linear-gradient(135deg,rgba(50,8,26,.9),rgba(20,4,12,.95));color:#ffe3ec;font-size:21px;font-weight:700;letter-spacing:6px;box-shadow:0 0 14px rgba(255,79,125,.5), 0 0 40px rgba(255,79,125,.22);text-shadow:0 0 12px rgba(255,79,125,.9);animation:dcpulse 2.2s ease-in-out infinite;">再来一次 ↻</div>
    </a>
  </div>

  <svg width="720" height="72" viewBox="0 0 720 72" style="position:absolute;left:0;bottom:78px;opacity:.55;">
    <path d="M0,72 L0,34 L38,34 L38,20 L74,20 L74,40 L118,40 L118,12 L152,12 L152,32 L200,32 L200,44 L248,44 L248,18 L286,18 L286,38 L338,38 L338,26 L382,26 L382,46 L430,46 L430,8 L462,8 L462,30 L512,30 L512,42 L556,42 L556,22 L596,22 L596,36 L648,36 L648,16 L682,16 L682,40 L720,40 L720,72 Z" fill="#070914"></path>
    <rect x="256" y="24" width="4" height="5" fill="#ff4fa3" opacity=".35"><animate attributeName="opacity" values=".35;.05;.35" dur="4.1s" repeatCount="indefinite"></animate></rect>
    <line x1="434" y1="8" x2="434" y2="46" stroke="#ff4fa3" stroke-width="1.5" opacity=".3"></line>
  </svg>
  <svg width="720" height="110" viewBox="0 0 720 110" style="position:absolute;left:0;bottom:0;opacity:.85;">
    <g style="animation:dchead 2.6s ease-in-out infinite;">
      <circle cx="60" cy="88" r="10" fill="#0c1022"></circle><circle cx="238" cy="87" r="11" fill="#0c1022"></circle><circle cx="470" cy="88" r="10" fill="#0c1022"></circle><circle cx="668" cy="87" r="11" fill="#0c1022"></circle>
    </g>
    <g style="animation:dchead 3s ease-in-out .5s infinite;">
      <circle cx="130" cy="96" r="12" fill="#101528"></circle><circle cx="340" cy="95" r="12" fill="#101528"></circle><circle cx="560" cy="96" r="12" fill="#101528"></circle>
    </g>
    <g>
      <circle cx="30" cy="104" r="13" fill="#12162c"></circle><circle cx="190" cy="105" r="13" fill="#12162c"></circle><circle cx="410" cy="104" r="13" fill="#12162c"></circle><circle cx="630" cy="105" r="13" fill="#12162c"></circle>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 720, &quot;height&quot;: 1280}, &quot;score&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 112, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;结算数据&quot;}, &quot;target&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 150, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;结算数据&quot;}}">
class Component extends DCLogic {
  state = { shown: 0 };
  componentDidMount() {
    const target = this.props.score ?? 112;
    const t0 = performance.now(), dur = 1100;
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / dur);
      const ease = 1 - Math.pow(1 - p, 3);
      this.setState({ shown: Math.round(target * ease) });
      if (p < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }
  renderVals() {
    const score = this.props.score ?? 112;
    const target = this.props.target ?? 150;
    return {
      shownScore: this.state.shown,
      target,
      lack: Math.max(0, target - score),
      scorePct: Math.min(100, Math.round(this.state.shown / target * 100)) + '%'
    };
  }
}
</script>
</body>
</html>
