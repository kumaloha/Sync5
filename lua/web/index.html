<script type="application/lua">
-- 引导:把 window.SYNC5_SOURCES 里的模块挂进 require, 建 App, 暴露给 JS。逻辑全在 Lua;JS 只画。
local js = require "js"
local SRC = js.global.SYNC5_SOURCES
table.insert(package.searchers, 2, function(name)
  local src = SRC[name]
  if type(src) ~= "string" then return "\n\tno bundled module '" .. name .. "'" end
  local chunk, err = load(src, "=" .. name)
  if not chunk then error(err) end
  return chunk, name
end)
local json = require("json")
local App = require("app.phrase")
local DB = require("core.db")
local ls = js.global.localStorage
local perf = js.global.performance
local storage = {
  read = function() local v = ls:getItem("sync5.save"); if type(v) ~= "string" then return nil end; return v end,
  write = function(s) ls:setItem("sync5.save", s) end,
}
local app = App.new({
  storage = storage,
  locale = function() return "cn" end,
  now_ms = function() return perf:now() end,
  now = function() return math.floor(js.global.Date:now() / 1000) end,
  day_key = function() local d = js.new(js.global.Date); return string.format("%04d-%02d-%02d", d:getFullYear(), d:getMonth() + 1, d:getDate()) end,
})
local function enc(v) if v == nil then return "null" end return json.encode(v) end
-- 逐个挂成 JS 全局函数(Lua 表的代理在 JS 里不能当对象点方法用);JS 调用时 this 是第一个参数。
local G = js.global
G.sync5_tick = function(_, ms) return app:tick(ms) end
G.sync5_view = function(_) return enc(app:view()) end
G.sync5_events = function(_) return enc(app:events()) end
G.sync5_ui = function(_) return enc(DB.ui()) end
G.sync5_jokers = function(_)
  local o = {}
  for _, e in ipairs(DB.jokers()) do o[e.id] = { cn = e.cn, fx = e.fx } end
  return enc(o)
end
G.sync5_intent = function(_, name, a, b)
  local f = app[name]
  if type(f) ~= "function" then return enc({ ok = false, why = "nointent:" .. tostring(name) }) end
  local ok, r = pcall(f, app, a, b)
  if not ok then return enc({ ok = false, why = "error", err = tostring(r) }) end
  return enc(r)
end
js.global.document:getElementById("boot").textContent = "lua ready · " .. _VERSION
</script>

<script>
(() => {
const W = 720, H = 1280;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

function card(c, x, y, w, h, opts) {

  if (s.mid) { T('还差 ' + s.need, sh.blind_pos[0] + 20, sh.blind_pos[1] + 44, 52, C.ink, 'left', 700, true); T('已得 ' + s.score + ' / 目标 ' + s.target + ' · 还剩 ' + s.left + ' 拍', sh.blind_pos[0] + 20, sh.blind_pos[1] + 112, 18, C.dim, 'left', 400, true); }

  const n = s.offers.length, cw = n <= 3 ? sh.card_w : sh.card_w_4, g = n <= 3 ? sh.card_gap : sh.card_gap_4, x0 = (720 - cw * n - g * (n - 1)) / 2;

  const by = sh.btn_y;
  rr(360 - 220 - 12, by, 220, 58, 16, 'rgba(41,48,102,0.9)', 'rgba(160,180,255,0.4)'); T(s.reroll_cost === 0 ? sh.free_text : sh.reroll_text.replace('%d', s.reroll_cost), 360 - 12 - 110, by + 16, 20, C.ink, 'center', 500, true); hit(360 - 220 - 12, by, 220, 58, 'reroll');
  rr(360 + 12, by, 220, 58, 16, 'rgba(41,48,102,0.9)', 'rgba(160,180,255,0.4)'); T(sh.skip_text, 360 + 12 + 110, by + 16, 20, C.ink, 'center', 500, true); hit(360 + 12, by, 220, 58, 'leave');
  // consumables
  const cy = sh.cons_y || 912, dd = sh.cons_disc || 132, colw = sh.cons_col_w || 190, cg = sh.cons_gap || 24, lx = sh.cons_left || 190, rx = sh.cons_right || 692, cx0 = lx + ((rx - lx) - (colw * 2 + cg)) / 2;
  s.consumables.forEach((c, i) => { const col = cx0 + i * (colw + cg), x = col + (colw - dd) / 2; if (!c) return; ctx.globalAlpha = c.armed ? 1 : 0.45; ctx.beginPath(); ctx.arc(x + dd / 2, cy + dd / 2, dd / 2, 0, Math.PI * 2); ctx.fillStyle = '#1a0710'; ctx.fill(); ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke(); if (c.stamp) T(c.stamp, x + dd / 2, cy + dd / 2 - 18, 34, C.gold, 'center', 700); T(c.name, col + colw / 2, cy + dd + 12, 15, C.ink, 'center', 500, true); wrap(CONS[c.id] || c.fx, col, cy + dd + 36, colw, 12, C.dim, 14, true, 2); T('◆ ' + c.price, col + colw / 2, cy + dd + 76, 17, C.gold, 'center', 700); ctx.globalAlpha = 1; hit(x, cy, dd, dd + 100, 'cons', i); });

    rr(0, 0, 720, 1280, 0, '#000');
    T('SYNC5', 360, 300, 96, C.cyan, 'center', 700); T('Lua 镜像 · 浏览器参考渲染器', 360, 410, 20, C.dim, 'center', 400, true);
    T('局数 ' + v.home.runs_total + ' · 体力 ' + v.home.energy + '/' + v.home.energy_max + ' · LV.' + v.home.profile.level, 360, 450, 16, C.dim, 'center', 400, true);
    if (v.resume_prompt) { rr(150, 560, 420, 60, 16, 'rgba(6,16,20,0.95)', C.cyan); T('继续上次的演出 ▸', 360, 578, 22, C.ink, 'center', 500, true); hit(150, 560, 420, 60, 'resume_run'); rr(150, 640, 420, 50, 16, 'rgba(22,6,9,0.95)', C.pink); T('放弃, 开新的一局', 360, 654, 18, C.pink, 'center', 500, true); hit(150, 640, 420, 50, 'drop'); }
    else { rr(150, 600, 420, 80, 20, 'rgba(6,16,20,0.95)', C.cyan, 2, C.cyan); T(v.home.seen_tutorial ? '开始巡演 ▸' : '开始(教学关)▸', 360, 622, 28, C.ink, 'center', 600, true); hit(150, 600, 420, 80, 'start'); }
    T('点击 = 选择 · 拖拽 = 手牌↔缓存对调 · P 暂停 · 数据/规则全在 Lua 里跑', 360, 1180, 14, C.dim, 'center', 400, true);
  }
  if (v.screen === 'intro') { rr(0, 0, 720, 1280, 0, 'rgba(0,0,0,0.78)'); const b = v.blind; T(v.intro.kind === 'gamma' ? '每场演出有一张盲注' : (b.is_wall ? 'BOSS 墙' : b.blind_name), 360, 420, 40, C.pink, 'center', 700, true); T(b.face ? b.face.name : '纯分数', 360, 490, 56, C.ink, 'center', 700, true); if (b.face) wrap(b.face.fx, 160, 570, 400, 22, C.dim, 28, false, 3); T('目标 ' + b.target, 360, 680, 30, C.gold, 'center', 600, true); T('巡演路线 · ' + (v.intro.route || []).map(r => r.name).join(' → '), 360, 812, 15, 'rgba(30,255,236,0.72)', 'center', 400, true); T('点击跳过', 360, 900, 14, C.dim, 'center', 400, true); hit(0, 0, 720, 1280, 'skip_intro'); }
  if (v.screen === 'cutin') { rr(0, 0, 720, 1280, 0, 'rgba(0,0,0,0.7)'); wrap((v.cutin.command || '').replace(/[{}]/g, ''), 120, 560, 480, 24, C.ink, 32, true); if (v.cutin.key === 'beta') T('+' + v.cutin.coins + ' ◆', 360, 660, 30, C.gold, 'center', 700); }
  if (v.tutorial && (v.screen === 'decision' || v.screen === 'draft') && v.tutorial.hint.command) { rr(40, 1190, 640, 64, 14, 'rgba(0,0,0,0.85)', C.cyan); T(v.tutorial.hint.signal, 60, 1198, 13, C.cyan, 'left', 700); wrap(v.tutorial.hint.command.replace(/[{}]/g, ''), 60, 1216, 600, 16, C.ink, 20, true, 2); }
  if (v.screen === 'end') { const e = v.end_screen; rr(0, 0, 720, 1280, 0, 'rgba(0,0,0,0.85)'); T(e.win ? '演出成功' : '演出失败', 360, 380, 56, e.win ? C.cyan : C.pink, 'center', 700, true); T(e.score + ' / ' + e.target, 360, 470, 40, C.ink, 'center', 600); if (e.why) T('预支违约 · 还不上 ' + e.why, 360, 530, 18, C.pink, 'center', 400, true); if (e.win) T('工资 +' + e.wage + ' ◆ · 第 ' + e.gig + ' 场谢幕', 360, 530, 18, C.gold, 'center', 400, true); rr(150, 640, 420, 60, 16, 'rgba(6,16,20,0.95)', C.cyan); T(e.win ? '谢幕 ▸' : '再来一次 ▸', 360, 658, 22, C.ink, 'center', 500, true); hit(150, 640, 420, 60, e.win ? 'end_next' : 'restart'); rr(150, 720, 420, 50, 16, 'rgba(22,6,9,0.95)', C.slate); T('返回主页', 360, 734, 18, C.dim, 'center', 500, true); hit(150, 720, 420, 50, 'end_home'); }
  if (v.paused) { rr(0, 0, 720, 1280, 0, 'rgba(0,0,5,0.72)'); rr(170, 470, 380, 230, 16, 'rgba(10,13,31,0.96)', C.cyan); T('暂停', 360, 492, 26, C.cyan, 'center', 600, true); rr(206, 552, 308, 46, 12, 'rgba(15,41,51,0.95)', C.cyan); T('继续 ▸', 360, 564, 19, C.ink, 'center', 500, true); hit(206, 552, 308, 46, 'resume'); rr(206, 612, 308, 44, 12, 'rgba(51,15,26,0.95)', C.pink); T('退出本局(不计战绩)', 360, 624, 17, C.pink, 'center', 500, true); hit(206, 612, 308, 44, 'quit_run'); }
  // floaters
  floaters.forEach(f => { ctx.globalAlpha = Math.max(0, 1 - f.age / f.ttl); T(f.text, f.x, f.y - f.age * 40, 26, f.color, 'center', 700, /[一-鿿]/.test(f.text)); ctx.globalAlpha = 1; });
}

function handleEvents(evs) {
  for (const e of evs) {
    if (e.kind === 'settle') { floater(`${e.base} × ${Number(e.mult).toFixed(2)} = ${e.score}`, 360, 560, C.cyan, 1.8); if (e.coins > 0) floater('+' + e.coins + ' ◆', 600, 150, C.gold); (e.popups || []).forEach((p, k) => setTimeout(() => floater(p.text, 26 + (p.slot + 0.5) * 167, 190, C.gold), 300 + 220 * k)); shakeT = 0.3; }
    else if (e.kind === 'deny') floater(e.text || e.why, 360, 1000, '#ff5f7e');
    else if (e.kind === 'section_clear') floater('目标达成 ✓  工资 +' + e.wage + ' ◆', 360, 640, C.cyan, 1.6);
    else if (e.kind === 'disc_fired') floater('▶ ' + e.names.join(' · '), 360, 620, C.suit_red, 1.6);
    else if (e.kind === 'loan_repay') floater('还款 -' + e.paid + ' ◆', 600, 150, C.pink);
    else if (e.kind === 'guest_exit') floater(e.name + ' 谢幕', 26 + (e.slot + 0.5) * 167, 190, C.pink);
    else if (e.kind === 'run_end') shakeT = 0.5;
  }
}

let JOKERS = {}, CONS = {};
function loop() {
  // 用定时器而不是 rAF:后台标签页 / 自动化驱动下 rAF 会停, 钟就不走了;逻辑层自己按 dt 限幅(≤0.5s/帧)
  const ts = performance.now();
  const dt = (ts - lastTick) / 1000; lastTick = ts;
  sync5_tick(performance.now());
  handleEvents(JSON.parse(sync5_events()));
  V = JSON.parse(sync5_view());
  floaters = floaters.filter(f => (f.age += dt) < f.ttl);
  hits = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (shakeT > 0) { shakeT -= dt; ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12); }
  if (V.screen !== 'front') drawStage();
  if (V.screen === 'draft' && V.shop) drawShop();
  drawOverlays();
}

function pt(e) { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: (t.clientX - r.left) / scale, y: (t.clientY - r.top) / scale }; }
function onDown(e) { const p = pt(e); const h = topHit(p); if (!h) return; if ((h.id === 'hand' || h.id === 'cache') && V.hand) { drag = { zone: h.id, i: h.data, start: p, p, moved: false, card: (h.id === 'hand' ? V.hand.cards : V.hand.cache)[h.data] }; } else drag = { hit: h, start: p, p, moved: false }; e.preventDefault(); }
function onMove(e) { if (!drag) return; drag.p = pt(e); if (Math.hypot(drag.p.x - drag.start.x, drag.p.y - drag.start.y) > 12) drag.moved = true; }
function onUp(e) {
  if (!drag) return; const d = drag; drag = null; const p = d.p;
  if (!d.moved) { const h = topHit(p); if (!h) return; click(h); return; }
  if (d.zone) { const t = topHit(p, x => x.id === 'hand' || x.id === 'cache' || x.id === 'discard'); if (!t) return; if (t.id === 'discard') call('discard_one', d.zone, d.i); else if (d.zone === 'hand' && t.id === 'cache') call('drag_swap', d.i, t.data); else if (d.zone === 'cache' && t.id === 'hand') call('drag_swap', t.data, d.i); }
}
function click(h) {
  const id = h.id, s = V.screen;
  if (id === 'start') call('start_run'); else if (id === 'resume_run') call('resume_run'); else if (id === 'drop') call('drop_checkpoint');
  else if (id === 'skip_intro') call('skip_intro');
  else if (id === 'hand') call('tap_hand', h.data); else if (id === 'cache') call('tap_cache', h.data);
  else if (id === 'sort') call('sort'); else if (id === 'discard') call('discard');
  else if (id === 'offer') call('buy', h.data); else if (id === 'cons') call('buy_consumable', h.data); else if (id === 'reroll') call('reroll'); else if (id === 'leave') call('leave');
  else if (id === 'slot' && s === 'draft' && V.shop && V.shop.replace_pick !== null && V.shop.replace_pick !== undefined) call('replace', h.data);
  else if (id === 'cancel_replace') call('cancel_replace');
  else if (id === 'end_next') call('end_next'); else if (id === 'restart') call('restart'); else if (id === 'end_home') call('end_home');
  else if (id === 'resume') call('resume'); else if (id === 'quit_run') call('quit_run');
}
cv.addEventListener('mousedown', onDown); addEventListener('mousemove', onMove); addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, { passive: false }); addEventListener('touchmove', onMove, { passive: false }); addEventListener('touchend', onUp);
addEventListener('keydown', e => { if (e.key === 'p') { if (V && V.paused) call('resume'); else call('pause'); } });

function boot() {
  if (!window.sync5_view) { setTimeout(boot, 50); return; }
  UI = JSON.parse(sync5_ui());
  // 卡面文案:小丑牌名 / 消耗牌描述都从 ui.json 与数据里来
  JOKERS = JSON.parse(sync5_jokers());
  const cc = UI.consumablecard || {}; for (const k in cc) CONS[k] = cc[k].trigger || cc[k].command || '';
  document.getElementById('boot').textContent = '';
  lastTick = performance.now();
  setInterval(loop, 40);
}
boot();
})();
