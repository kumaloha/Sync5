<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#04050d; }
  a { color:#35e8e0; text-decoration:none; } a:hover { color:#ff4fa3; }
  @keyframes dcstarin { 0% { transform:scale(3.2) rotate(-18deg); opacity:0; } 55% { transform:scale(.92) rotate(2deg); opacity:1; } 75% { transform:scale(1.12); } 100% { transform:scale(1) rotate(0deg); opacity:1; } }
  @keyframes dcmergein { 0% { transform:scale(.3); opacity:0; } 40% { transform:scale(1.15); opacity:1; } 70% { transform:scale(.97); } 100% { transform:scale(1); opacity:1; } }
  @keyframes dcfall { 0% { transform:translateY(-60px) rotate(0deg); opacity:0; } 6% { opacity:1; } 96% { opacity:.9; } 100% { transform:translateY(1180px) rotate(var(--rr)); opacity:0; } }
  @keyframes dcbeam { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(8deg); } }
  @keyframes dcsway { 0%,100% { transform:rotate(-12deg); } 50% { transform:rotate(12deg); } }
  @keyframes dchead { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
  @keyframes dcpulse { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  @keyframes dcglowpulse { 0%,100% { text-shadow:0 0 16px rgba(53,232,224,.9), 0 0 46px rgba(53,232,224,.5); } 50% { text-shadow:0 0 24px rgba(53,232,224,1), 0 0 70px rgba(53,232,224,.7); } }
</style>
</helmet>
<div style="position:relative;width:720px;height:1280px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#070a1a 0%,#0a0d22 45%,#05060f 78%,#03030a 100%);font-family:'Rajdhani','Noto Sans SC',sans-serif;color:#cfe6ef;user-select:none;">
  <div style="position:absolute;inset:0;background:radial-gradient(520px 300px at 8% 0%,rgba(53,232,224,.22),transparent 68%),radial-gradient(560px 320px at 94% 6%,rgba(255,79,163,.20),transparent 68%),radial-gradient(400px 260px at 50% 8%,rgba(165,107,255,.14),transparent 70%);"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 18%,rgba(160,200,255,.04) 32%,rgba(255,255,255,.08) 39%,transparent 50%,transparent 62%,rgba(160,200,255,.05) 74%,transparent 86%);"></div>
  <div style="position:absolute;left:60px;top:40px;width:600px;height:900px;pointer-events:none;">
    <div style="position:absolute;left:20px;top:-14px;width:300px;height:880px;transform-origin:50% 0;animation:dcbeam 5s ease-in-out infinite;">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(53,232,224,.28),rgba(53,232,224,.09) 50%,transparent 88%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(7px);"></div>
      <div style="position:absolute;left:50%;top:-3px;width:12px;height:12px;transform:translateX(-50%);border-radius:50%;background:#c9fffa;box-shadow:0 0 18px 7px rgba(53,232,224,.75);"></div>
    </div>
    <div style="position:absolute;right:20px;top:-14px;width:300px;height:880px;transform-origin:50% 0;animation:dcbeam 6s ease-in-out .8s infinite;">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,79,163,.24),rgba(255,79,163,.08) 50%,transparent 88%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(7px);"></div>
      <div style="position:absolute;left:50%;top:-3px;width:12px;height:12px;transform:translateX(-50%);border-radius:50%;background:#ffd6e9;box-shadow:0 0 18px 7px rgba(255,79,163,.7);"></div>
    </div>
  </div>
  <sc-for list="{{ confetti }}" as="cf" hint-placeholder-count="0">
    <div style="position:absolute;left:{{ cf.x }};top:0;width:{{ cf.w }};height:{{ cf.h }};background:{{ cf.color }};border-radius:2px;box-shadow:0 0 8px {{ cf.color }};--rr:{{ cf.rr }};animation:dcfall {{ cf.dur }} linear {{ cf.delay }} infinite;z-index:3;pointer-events:none;"></div>
  </sc-for>

  <div style="position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;gap:26px;z-index:4;">
    <div style="font-size:96px;line-height:1;color:#ffb347;text-shadow:0 0 20px rgba(255,179,71,.9), 0 0 60px rgba(255,179,71,.5);animation:dcstarin .55s cubic-bezier(.25,1.2,.4,1) .1s both;">★</div>
    <div style="font-size:120px;line-height:1;color:#ffb347;text-shadow:0 0 24px rgba(255,179,71,1), 0 0 70px rgba(255,179,71,.6);transform:translateY(-20px);animation:dcstarin .55s cubic-bezier(.25,1.2,.4,1) .32s both;">★</div>
    <div style="font-size:96px;line-height:1;color:#ffb347;text-shadow:0 0 20px rgba(255,179,71,.9), 0 0 60px rgba(255,179,71,.5);animation:dcstarin .55s cubic-bezier(.25,1.2,.4,1) .54s both;">★</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:346px;text-align:center;z-index:4;">
    <div style="font-size:72px;font-weight:700;letter-spacing:18px;color:#eafffd;line-height:1;animation:dcglowpulse 2.4s ease-in-out infinite;">演出成功</div>
    <div style="margin-top:14px;font-size:17px;letter-spacing:12px;color:#5fd8d0;">STAGE CLEAR · 全场沸腾</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:490px;display:flex;justify-content:center;z-index:4;">
    <div style="position:relative;width:460px;padding:26px 36px 24px;border-radius:22px;border:1px solid rgba(53,232,224,.4);background:linear-gradient(165deg,rgba(10,26,32,.7),rgba(5,12,18,.82));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(53,232,224,.15), inset 0 1px 0 rgba(255,255,255,.12);animation:dcmergein .5s ease .5s both;">
      <div style="display:flex;align-items:baseline;justify-content:center;gap:12px;">
        <span style="font-size:16px;letter-spacing:3px;color:#66799f;">最终得分</span>
        <span style="font-size:88px;font-weight:700;color:#ffd9a0;text-shadow:0 0 20px rgba(255,179,71,.8), 0 0 60px rgba(255,179,71,.4);line-height:1;">{{ shownScore }}</span>
        <span style="font-size:20px;color:#66799f;">/ {{ target }}</span>
      </div>
      <div style="margin-top:8px;height:10px;border-radius:6px;background:rgba(20,26,54,.9);border:1px solid rgba(120,150,200,.18);overflow:hidden;">
        <div style="height:100%;border-radius:6px;background:linear-gradient(90deg,#35e8e0,#ffb347);box-shadow:0 0 10px rgba(255,179,71,.7);width:{{ scorePct }};transition:width .1s linear;"></div>
      </div>
      <div style="margin-top:16px;display:flex;justify-content:center;gap:12px;">
        <div style="display:flex;align-items:center;gap:8px;padding:7px 20px;border-radius:16px;border:1px solid rgba(255,179,71,.5);background:rgba(30,18,4,.6);">
          <div style="width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9c9,#ffb347 60%,#c77b12);box-shadow:0 0 10px rgba(255,179,71,.7);"></div>
          <span style="font-size:21px;font-weight:700;color:#ffd9a0;">+{{ reward }}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 20px;border-radius:16px;border:1px solid rgba(165,107,255,.5);background:rgba(20,10,36,.6);">
          <span style="font-size:19px;color:#cdb2ff;text-shadow:0 0 8px rgba(165,107,255,.7);">♪ 新小丑牌 · 回响</span>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:840px;display:flex;justify-content:center;gap:16px;z-index:4;">
    <a href="Home 主页.dc.html" style="display:block;width:215px;">
      <div style-hover="transform:scale(1.04);" style="padding:15px 0;border-radius:16px;cursor:pointer;transition:transform .15s;text-align:center;border:1px solid rgba(120,150,200,.4);background:rgba(12,16,36,.6);color:#aebfe0;font-size:20px;letter-spacing:5px;">返回主页</div>
    </a>
    <a href="Neon Rain Card Game.dc.html" style="display:block;width:215px;">
      <div style-hover="transform:scale(1.04);" style-active="transform:scale(.97);" style="position:relative;padding:15px 0;border-radius:16px;cursor:pointer;transition:transform .15s;text-align:center;border:2px solid rgba(53,232,224,.9);background:linear-gradient(135deg,rgba(6,36,40,.9),rgba(4,16,22,.95));color:#eafffd;font-size:21px;font-weight:700;letter-spacing:6px;box-shadow:0 0 14px rgba(53,232,224,.5), 0 0 40px rgba(53,232,224,.25);text-shadow:0 0 12px rgba(53,232,224,.9);animation:dcpulse 2.2s ease-in-out infinite;">下一关 ▸</div>
    </a>
  </div>

  <svg width="720" height="72" viewBox="0 0 720 72" style="position:absolute;left:0;bottom:96px;opacity:.8;">
    <path d="M0,72 L0,34 L38,34 L38,20 L74,20 L74,40 L118,40 L118,12 L152,12 L152,32 L200,32 L200,44 L248,44 L248,18 L286,18 L286,38 L338,38 L338,26 L382,26 L382,46 L430,46 L430,8 L462,8 L462,30 L512,30 L512,42 L556,42 L556,22 L596,22 L596,36 L648,36 L648,16 L682,16 L682,40 L720,40 L720,72 Z" fill="#070914"></path>
    <rect x="128" y="18" width="4" height="5" fill="#35e8e0" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="3.2s" repeatCount="indefinite"></animate></rect>
    <rect x="256" y="24" width="4" height="5" fill="#ff4fa3" opacity=".6"><animate attributeName="opacity" values=".6;.1;.6" dur="4.1s" repeatCount="indefinite"></animate></rect>
    <rect x="438" y="14" width="4" height="5" fill="#a56bff" opacity=".7"><animate attributeName="opacity" values=".7;.2;.7" dur="2.7s" repeatCount="indefinite"></animate></rect>
    <line x1="434" y1="8" x2="434" y2="46" stroke="#ff4fa3" stroke-width="1.5" opacity=".7"></line>
    <line x1="156" y1="12" x2="156" y2="32" stroke="#35e8e0" stroke-width="1.5" opacity=".6"></line>
  </svg>
  <div style="position:absolute;left:0;right:0;bottom:0;height:180px;pointer-events:none;background:radial-gradient(360px 70px at 50% 78%,rgba(165,107,255,.14),transparent 70%),radial-gradient(220px 50px at 14% 85%,rgba(53,232,224,.10),transparent 70%),radial-gradient(220px 50px at 86% 85%,rgba(255,79,163,.10),transparent 70%);"></div>
  <svg width="720" height="110" viewBox="0 0 720 110" style="position:absolute;left:0;bottom:0;">
    <sc-for list="{{ glowSticks }}" as="gs" hint-placeholder-count="0">
      <g style="animation:dcsway {{ gs.dur }} ease-in-out {{ gs.delay }} infinite;transform-box:fill-box;transform-origin:50% 100%;">
        <line x1="{{ gs.ax1 }}" y1="{{ gs.ay1 }}" x2="{{ gs.ax2 }}" y2="{{ gs.ay2 }}" stroke="#141a34" stroke-width="4.5" stroke-linecap="round"></line>
        <line x1="{{ gs.gx1 }}" y1="{{ gs.gy1 }}" x2="{{ gs.gx2 }}" y2="{{ gs.gy2 }}" stroke="{{ gs.color }}" stroke-width="3.4" stroke-linecap="round" opacity=".9" style="filter:drop-shadow(0 0 5px {{ gs.color }});"></line>
      </g>
    </sc-for>
    <g style="animation:dchead 1s ease-in-out infinite;">
      <circle cx="22" cy="86" r="10" fill="#0c1022"></circle><circle cx="76" cy="85" r="11" fill="#0c1022"></circle><circle cx="132" cy="87" r="10" fill="#0c1022"></circle><circle cx="188" cy="85" r="11" fill="#0c1022"></circle><circle cx="244" cy="86" r="10" fill="#0c1022"></circle><circle cx="300" cy="85" r="11" fill="#0c1022"></circle><circle cx="356" cy="87" r="10" fill="#0c1022"></circle><circle cx="412" cy="85" r="11" fill="#0c1022"></circle><circle cx="468" cy="86" r="10" fill="#0c1022"></circle><circle cx="524" cy="85" r="11" fill="#0c1022"></circle><circle cx="580" cy="87" r="10" fill="#0c1022"></circle><circle cx="636" cy="85" r="11" fill="#0c1022"></circle><circle cx="692" cy="86" r="10" fill="#0c1022"></circle>
    </g>
    <g style="animation:dchead .8s ease-in-out .3s infinite;">
      <circle cx="48" cy="93" r="12" fill="#101530"></circle><circle cx="106" cy="92" r="13" fill="#101530"></circle><circle cx="164" cy="94" r="12" fill="#101530"></circle><circle cx="222" cy="92" r="13" fill="#101530"></circle><circle cx="280" cy="93" r="12" fill="#101530"></circle><circle cx="338" cy="92" r="13" fill="#101530"></circle><circle cx="396" cy="94" r="12" fill="#101530"></circle><circle cx="454" cy="92" r="13" fill="#101530"></circle><circle cx="512" cy="93" r="12" fill="#101530"></circle><circle cx="570" cy="92" r="13" fill="#101530"></circle><circle cx="628" cy="94" r="12" fill="#101530"></circle><circle cx="686" cy="92" r="13" fill="#101530"></circle>
    </g>
    <g style="animation:dchead 1.2s ease-in-out .6s infinite;">
      <circle cx="20" cy="102" r="13" fill="#131836"></circle><circle cx="80" cy="103" r="14" fill="#131836"></circle><circle cx="140" cy="102" r="13" fill="#131836"></circle><circle cx="200" cy="103" r="14" fill="#131836"></circle><circle cx="260" cy="102" r="13" fill="#131836"></circle><circle cx="320" cy="103" r="14" fill="#131836"></circle><circle cx="380" cy="102" r="13" fill="#131836"></circle><circle cx="440" cy="103" r="14" fill="#131836"></circle><circle cx="500" cy="102" r="13" fill="#131836"></circle><circle cx="560" cy="103" r="14" fill="#131836"></circle><circle cx="620" cy="102" r="13" fill="#131836"></circle><circle cx="680" cy="103" r="14" fill="#131836"></circle>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 720, &quot;height&quot;: 1280}, &quot;score&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 186, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;结算数据&quot;}, &quot;target&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 150, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;结算数据&quot;}, &quot;reward&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 220, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;结算数据&quot;}}">
class Component extends DCLogic {
  state = { shown: 0 };
  componentDidMount() {
    const target = this.props.score ?? 186;
    const t0 = performance.now(), dur = 1300;
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / dur);
      const ease = 1 - Math.pow(1 - p, 3);
      this.setState({ shown: Math.round(target * ease) });
      if (p < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); }
  glowSticks() {
    if (this._sticks) return this._sticks;
    const colors = ['#35e8e0', '#ff4fa3', '#a56bff', '#ffb347', '#9fe9ff', '#ff8bbd', '#cdb2ff'];
    const rnd = (seed) => { let x = Math.sin(seed * 999) * 10000; return x - Math.floor(x); };
    this._sticks = Array.from({ length: 26 }, (_, i) => {
      const x = 14 + i * 27 + rnd(i) * 14;
      const dx = (rnd(i + 40) - 0.5) * 18;
      const topY = 52 + rnd(i + 80) * 10;
      return {
        ax1: x, ay1: 90 + rnd(i + 120) * 6,
        ax2: x + dx, ay2: topY + 4,
        gx1: x + dx, gy1: topY + 4,
        gx2: x + dx * 1.3, gy2: topY - 12,
        color: colors[i % colors.length],
        dur: (0.7 + rnd(i + 200) * 0.5).toFixed(2) + 's',
        delay: (rnd(i + 300) * 1.2).toFixed(2) + 's'
      };
    });
    return this._sticks;
  }
  confetti() {
    if (this._cf) return this._cf;
    const colors = ['#35e8e0', '#ff4fa3', '#a56bff', '#ffb347', '#9fe9ff', '#ff8bbd'];
    const rnd = (seed) => { let x = Math.sin(seed * 787.7) * 10000; return x - Math.floor(x); };
    this._cf = Array.from({ length: 26 }, (_, i) => ({
      x: (rnd(i) * 96 + 2) + '%',
      w: (5 + rnd(i + 30) * 7) + 'px',
      h: (10 + rnd(i + 60) * 10) + 'px',
      color: colors[i % colors.length],
      rr: (360 + rnd(i + 90) * 720) + 'deg',
      dur: (3.4 + rnd(i + 120) * 3) + 's',
      delay: (-rnd(i + 150) * 6).toFixed(2) + 's'
    }));
    return this._cf;
  }
  renderVals() {
    const target = this.props.target ?? 150;
    return {
      shownScore: this.state.shown,
      target,
      reward: this.props.reward ?? 220,
      scorePct: Math.min(100, Math.round(this.state.shown / target * 100)) + '%',
      glowSticks: this.glowSticks(),
      confetti: this.confetti()
    };
  }
}
</script>
</body>
</html>
